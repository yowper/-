apply plugin: 'com.android.application'

android {
    namespace 'com.example.volumeswipe'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.volumeswipe"
        minSdk 24
        targetSdk 34
        versionCode 49
        versionName "2.29"
        // 体积：只要手机在用的 arm64-v8a。
        // 不管的话 APK 里会同时装 x86 / x86_64 / armeabi-v7a / mips 四套 native 库，
        // 白白多出 20 多 MB。
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packagingOptions {
        // Vosk 需要把 native 库解压出来
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    // 唤醒词识别（只用来听“小助手”，真正的命令交给输入法）
    implementation 'com.alphacephei:vosk-android:0.3.47'
    // 截图读秒：ML Kit 中文文字识别（离线内置模型，不联网也能用）
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
